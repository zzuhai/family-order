server:
  port: 8080

spring:
  application:
    name: family-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/family_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: mysqlroot
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.family.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: YourSecretKeyForFamilyOrderSystem2024MustBe256BitsOrLonger!
  expiration: 604800000

wechat:
  appid: wx9f6ef85cd26ab67a
  secret: 7a01516e15573bcc0f80bf51baf50760

logging:
  level:
    com.family.order: debug